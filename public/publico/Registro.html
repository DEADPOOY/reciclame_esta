<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta · ReciclaTech</title>
<link rel="icon" type="image/png" href="/imagenes/favicon.png">
<link rel="stylesheet" href="../../css/estilos.css">
</head>
<body data-pagina="Registro" data-acceso="invitado" data-menu="Registro.html">
<a class="sr-only" href="#principal">Saltar al contenido</a>
<header id="cabecera"></header>
<main class="contenido" id="principal">

<div class="caja-centro tarjeta">
  <h1>Crear cuenta</h1>
  <p class="suave">Escribe tus nombres y apellidos por separado. Se aceptan letras, acentos, la Ñ y espacios; números, símbolos y emojis se quitarán.</p>
  <div id="msg" class="mensaje" role="alert" hidden></div>
  <form id="form-registro" novalidate>
    <div class="campo"><label for="nombres">Nombre(s)</label><input type="text" id="nombres" name="nombres" autocomplete="given-name" maxlength="80"><div class="error-campo" aria-live="polite"></div></div>
    <div class="campo"><label for="apellido-paterno">Apellido paterno</label><input type="text" id="apellido-paterno" name="apellido_paterno" autocomplete="family-name" maxlength="80"><div class="error-campo" aria-live="polite"></div></div>
    <div class="campo"><label for="apellido-materno">Apellido materno</label><input type="text" id="apellido-materno" name="apellido_materno" maxlength="80"><div class="error-campo" aria-live="polite"></div></div>
    <input type="hidden" id="nombre-completo" name="nombre">
    <div class="campo"><label for="email">Correo electrónico</label><input type="email" id="email" name="email" autocomplete="email" maxlength="254"><div class="error-campo" aria-live="polite"></div></div>
    <div class="campo"><label for="password">Contraseña</label><input type="password" id="password" name="password" autocomplete="new-password" minlength="12" maxlength="128"><div class="error-campo" aria-live="polite"></div></div>
    <div class="campo"><label for="confirmar">Confirmar contraseña</label><input type="password" id="confirmar" name="confirmar" autocomplete="new-password" minlength="12" maxlength="128"><div class="error-campo" aria-live="polite"></div></div>
    <div class="fila-botones"><button class="btn" type="submit">Crear cuenta</button><button class="btn sec" type="reset">Limpiar</button></div>
  </form>
  <div class="separador"><span>o regístrate con</span></div>
  <div id="auth-social" class="redes">
    <button class="btn-social" type="button" data-proveedor="github"><span class="social-icon github" aria-hidden="true">GH</span>Continuar con GitHub</button>
  </div>
  <p class="centrado chico" style="margin-top:1rem">¿Ya tienes cuenta? <a href="Login.html">Inicia sesión</a></p>
</div>

</main>
<footer id="pie"></footer>
<script src="/vendor/supabase/supabase.js"></script>
<script src="../../js/datos.js"></script>
<script src="../../js/app.js"></script>
<script src="../../js/dominios_correo.js"></script>
<script src="../../js/validaciones.js"></script>
<script src="../../js/supabase_cliente.js"></script>
<script src="../../js/paginas_publicas.js"></script>
</body>
</html>
