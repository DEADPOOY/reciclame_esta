<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestionar ubicación · ReciclaTech</title>
<link rel="icon" type="image/png" href="/recursos/imagenes/favicon.png">
<link rel="stylesheet" href="/recursos/css/estilos.css">
</head>
<body data-pagina="AdmUbicacion" data-acceso="admin" data-menu="AdmUbicacion.html">
<a class="sr-only" href="#principal">Saltar al contenido</a>
<header id="cabecera"></header>
<div class="cuerpo-admin"><aside id="menu-admin"></aside><main class="contenido" id="principal">

<h1>Gestionar ubicación</h1>
<div class="campo" style="max-width:480px"><label for="punto">Punto de recepción</label><select id="punto"></select><div class="error-campo" aria-live="polite"></div></div>
<div class="dos-col igual">
  <form id="form-ubicacion" novalidate>
<div class="campo"><label for="calle">Calle y número</label><input type="text" id="calle" name="calle" placeholder="Calle y número"><div class="error-campo" aria-live="polite"></div></div><div class="campo"><label for="colonia">Colonia</label><input type="text" id="colonia" name="colonia" placeholder="Colonia"><div class="error-campo" aria-live="polite"></div></div><div class="campo"><label for="alcaldia">Alcaldía</label><select id="alcaldia" name="alcaldia"></select><div class="error-campo" aria-live="polite"></div></div><div class="campo"><label for="cp">Código postal</label><input type="text" id="cp" name="cp" placeholder="00000" inputmode="numeric" maxlength="5"><div class="error-campo" aria-live="polite"></div></div>
    <div class="campo"><label for="lat">Latitud (opcional)</label><input type="number" id="lat" name="lat" step="0.0000001" min="19" max="19.65" placeholder="19.4326"><div class="error-campo" aria-live="polite"></div></div>
    <div class="campo"><label for="lng">Longitud (opcional)</label><input type="number" id="lng" name="lng" step="0.0000001" min="-99.4" max="-98.9" placeholder="-99.1332"><div class="error-campo" aria-live="polite"></div></div>
    <div class="fila-botones"><button class="btn" type="submit">Guardar</button><button class="btn sec" type="reset">Cancelar</button></div>
  </form>
  <div><iframe id="mapa" class="mapa mapa-alto" title="Vista previa de la ubicación" loading="lazy"></iframe><p class="suave chico">Vista previa según las coordenadas, el código postal o la alcaldía.</p></div>
</div>

</main></div>
<footer id="pie"></footer>
<script src="/recursos/js/datos.js"></script>
<script src="/recursos/js/app.js"></script>
<script src="/recursos/js/validaciones.js"></script>
<script src="/recursos/js/paginas_pa_admins.js"></script>
</body>
</html>
