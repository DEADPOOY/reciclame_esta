<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestionar ubicación · ReciclaTech</title>
<link rel="stylesheet" href="../stilos_perrones/estilos.css">
</head>
<body data-pagina="AdmUbicacion" data-acceso="admin" data-menu="AdmUbicacion.html">
<a class="sr-only" href="#principal">Saltar al contenido</a>
<header id="cabecera"></header>ta
<div class="cuerpo-admin"><aside id="menu-admin"></aside><main class="contenido" id="principal">

<h1>Gestionar ubicación</h1>
<div class="campo" style="max-width:480px"><label for="punto">Punto de recepción</label><select id="punto"></select><div class="error-campo" aria-live="polite"></div></div>
<div class="dos-col igual">
  <form id="form-ubicacion" novalidate>
<div class="campo"><label for="calle">Calle y número</label><input type="text" id="calle" name="calle" placeholder="Calle y número" ><div class="error-campo" aria-live="polite"></div></div><div class="campo"><label for="colonia">Colonia</label><input type="text" id="colonia" name="colonia" placeholder="Colonia" ><div class="error-campo" aria-live="polite"></div></div><div class="campo"><label for="alcaldia">Alcaldía</label><select id="alcaldia" name="alcaldia" ></select><div class="error-campo" aria-live="polite"></div></div><div class="campo"><label for="cp">Código postal</label><input type="text" id="cp" name="cp" placeholder="00000" inputmode="numeric" maxlength="5"><div class="error-campo" aria-live="polite"></div></div><div class="campo"><label for="lat">Latitud</label><input type="text" id="lat" name="lat" placeholder="19.432600" inputmode="decimal"><div class="error-campo" aria-live="polite"></div></div><div class="campo"><label for="lng">Longitud</label><input type="text" id="lng" name="lng" placeholder="-99.133200" inputmode="decimal"><div class="error-campo" aria-live="polite"></div></div>
    <div class="fila-botones"><button class="btn" type="submit">Guardar</button><button class="btn sec" type="reset">Cancelar</button></div>
  </form>
  <div><iframe id="mapa" class="mapa mapa-alto" title="Vista previa de la ubicación" loading="lazy"></iframe><p class="suave chico">Vista previa según la latitud y longitud capturadas.</p></div>
</div>

</main></div>
<footer id="pie"></footer>
<script src="../js/datos.js"></script>
<script src="../js/app.js"></script>
<script src="../js/paginas.js"></script>
</body>
</html>
