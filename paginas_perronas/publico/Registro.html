<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta · ReciclaTech</title>
<link rel="stylesheet" href="../../stilos_perrones/estilos.css">
</head>
<body data-pagina="Registro" data-acceso="invitado" data-menu="Registro.html">
<a class="sr-only" href="#principal">Saltar al contenido</a>
<header id="cabecera"></header>
<main class="contenido" id="principal">

<div class="caja-centro tarjeta">
  <h1>Crear cuenta</h1>
  <p class="suave">Crea una cuenta con tu correo y una contraseña de al menos 12 caracteres.</p>
  <div id="msg" class="mensaje" role="alert" hidden></div>
  <form id="form-registro" novalidate>
    <div class="campo"><label for="nombre">Nombre completo</label><input type="text" id="nombre" name="nombre" autocomplete="name" maxlength="160"><div class="error-campo" aria-live="polite"></div></div>
    <div class="campo"><label for="email">Correo electrónico</label><input type="email" id="email" name="email" autocomplete="email" maxlength="254"><div class="error-campo" aria-live="polite"></div></div>
    <div class="campo"><label for="password">Contraseña</label><input type="password" id="password" name="password" autocomplete="new-password" minlength="12" maxlength="128"><div class="error-campo" aria-live="polite"></div></div>
    <div class="campo"><label for="confirmar">Confirmar contraseña</label><input type="password" id="confirmar" name="confirmar" autocomplete="new-password" minlength="12" maxlength="128"><div class="error-campo" aria-live="polite"></div></div>
    <div class="fila-botones"><button class="btn" type="submit">Crear cuenta</button><button class="btn sec" type="reset">Limpiar</button></div>
  </form>
  <p class="centrado chico" style="margin-top:1rem">¿Ya tienes cuenta? <a href="Login.html">Inicia sesión</a></p>
</div>

</main>
<footer id="pie"></footer>
<script src="../../js_perrones/datos.js"></script>
<script src="../../js_perrones/app.js"></script>
<script src="../../js_perrones/validaciones.js"></script>
<script src="../../js_perrones/paginas_pa_jodidos.js"></script>
</body>
</html>
