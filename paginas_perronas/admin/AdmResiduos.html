<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<body data-pagina="AdmResiduos" data-acceso="admin" data-menu="AdmResiduos.html">

  <div id="tipos" class="rejilla c2"></div>
</section>

  <button class="btn sec" id="agregar" type="button">Agregar</button>
</div>
<div class="fila-botones"><button class="btn" id="guardar" type="button">Guardar</button><button class="btn sec" id="cancelar" type="button">Cancelar</button></div>

</main></div>
<footer id="pie"></footer>
