<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · ReciclaTech</title>
<link rel="stylesheet" href="../../css/estilos.css">
</head>
<body data-pagina="Login" data-acceso="invitado" data-menu="Login.html">
<a class="sr-only" href="#principal">Saltar al contenido</a>
<header id="cabecera"></header>
<main class="contenido" id="principal">

<div class="caja-centro tarjeta">
  <h1 class="centrado">ReciclaTech</h1>
  <p class="suave centrado">Accede con tu correo y contraseña.</p>
  <div id="msg" class="mensaje" role="alert" hidden></div>
  <form id="form-login" novalidate>
    <div class="campo"><label for="email">Correo electrónico</label><input type="email" id="email" name="email" autocomplete="email" maxlength="254"><div class="error-campo" aria-live="polite"></div></div>
    <div class="campo"><label for="password">Contraseña</label><input type="password" id="password" name="password" autocomplete="current-password" maxlength="128"><div class="error-campo" aria-live="polite"></div></div>
    <div class="fila-botones"><button class="btn" type="submit">Iniciar sesión</button><button class="btn sec" type="reset">Limpiar</button></div>
  </form>
  <p class="centrado chico" style="margin-top:1rem">¿No tienes cuenta? <a href="Registro.html">Regístrate</a></p>
</div>

</main>
<footer id="pie"></footer>
<script src="../../js/datos.js"></script>
<script src="../../js/app.js"></script>
<script src="../../js/validaciones.js"></script>
<script src="../../js/paginas_publicas.js"></script>
</body>
</html>
